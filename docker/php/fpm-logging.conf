; [post-incident 2026-08-30] Pin php-fpm's worker-output forwarding so our
; observability contract is version-controlled in THIS repo, not silently
; inherited from an undocumented base-image default.
;
; The base php:8.2-fpm-alpine image already ships these exact values in
; /usr/local/etc/php-fpm.d/docker.conf; this file re-affirms them so a future
; base-image bump can never quietly drop the log path the incident post-mortem
; depends on. Copied to php-fpm.d/zz-logging.conf so it loads LAST (after
; docker.conf and zz-docker.conf) and is authoritative. Re-opening [global]/[www]
; across multiple files is exactly what the base image itself does (docker.conf,
; www.conf and zz-docker.conf all do), so this is a supported, conflict-free
; override of identical values.

[global]
; php-fpm's own log (and the caught worker output below) -> the master's stderr,
; which docker/supervisord.conf forwards to the container's /dev/stderr.
error_log = /proc/self/fd/2

[www]
; Send each worker's stdout/stderr to the master error log above, undecorated,
; so a PHP error_log() line (see docker/php/errors.ini) reaches Railway intact.
catch_workers_output = yes
decorate_workers_output = no
