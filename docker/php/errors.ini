; [post-incident 2026-08-30] Make PHP errors VISIBLE in Railway logs.
;
; The 16h outage was a swallowed DB error that never reached a log. This ini
; guarantees PHP's own error channel goes to the container's stderr (which
; supervisord forwards to /dev/stderr -> Railway), while NEVER leaking an error
; or any PII into an HTTP response the guest sees.
;
; Loaded from conf.d AFTER the stock php.ini-production (Dockerfile installs
; php.ini-production, then COPYs this next to uploads.ini), so these win.
;
; The php-fpm side of this is already handled by the base image's
; /usr/local/etc/php-fpm.d/docker.conf (error_log = /proc/self/fd/2,
; catch_workers_output = yes, decorate_workers_output = no) and reaffirmed in
; docker/php/fpm-logging.conf; docker/supervisord.conf forwards php-fpm
; stdout/stderr to the container's stdout/stderr.

; Log errors; send them to the container's stderr (a symlink to the worker's
; fd 2, which php-fpm catches and forwards to its own error log -> stderr).
log_errors = On
error_log = /dev/stderr

; NON-NEGOTIABLE: never render a PHP error/stack trace (or the PII in it) into
; an HTTP response. php.ini-production already sets these Off; pin them here so
; the guarantee is version-controlled in THIS repo, not inherited silently.
display_errors = Off
display_startup_errors = Off

; Report everything so nothing is filtered out before it can be logged.
error_reporting = E_ALL
